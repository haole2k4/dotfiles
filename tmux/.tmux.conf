# Bật hỗ trợ chuột (click chọn khung, kéo chỉnh kích thước, cuộn lịch sử log của Agent)
set -g mouse on

# Hỗ trợ hiển thị màu sắc chuẩn 24-bit cho Ghostty / Neovim / Agent TUI
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Đánh số cửa sổ và khung bắt đầu từ 1 thay vì 0 (dễ bấm phím tắt hơn)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Bật thanh trạng thái trên đỉnh mỗi khung (Pane) để theo dõi từng Agent CLI
set -g pane-border-status top
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9,bold"

set -g pane-border-format " #(cd #{pane_current_path} && if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then echo '#[fg=#6272a4][NO-GIT]'; elif [ \"$(git rev-parse --git-dir 2>/dev/null)\" != \"$(git rev-parse --git-common-dir 2>/dev/null)\" ]; then echo '#[fg=#ff79c6,bold][WORKTREE]'; else echo '#[fg=#8be9fd,bold][MAIN]'; fi) #[fg=#6272a4]│ #[fg=#f1fa8c,bold]#{b:pane_current_path} #[fg=#6272a4]│ #[fg=#50fa7b]git:#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-') #[fg=#6272a4]│ #[fg=#ffb86c]cmd:#{pane_current_command} #[default]"

# Phím tắt r để reload nhanh cấu hình tmux (Ctrl+b rồi bấm r)
bind r source-file ~/.tmux.conf \; display-message "Đã nạp lại ~/.tmux.conf!"
